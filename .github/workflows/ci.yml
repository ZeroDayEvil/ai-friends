name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    name: Политика зависимостей
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Проверка пинов и запрета curl|bash
        run: node scripts/check-pins.mjs

  shell:
    name: Оболочка
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning $(git ls-files '*.sh')

  powershell:
    name: PowerShell
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning
          $issues | Format-Table -AutoSize
          if ($issues | Where-Object Severity -eq 'Error') { exit 1 }

      # Кодировка важна не косметически: Windows PowerShell 5.1 читает файл без
      # BOM как ANSI, и кириллица в строках ломает синтаксис -- буква "В" в
      # UTF-8 превращается в типографскую кавычку, которую парсер считает
      # границей строки. Мы на это уже наступали.
      - name: Кодировка файлов PowerShell
        shell: pwsh
        run: |
          $bad = @()
          foreach ($f in git ls-files '*.ps1') {
            $bytes = [System.IO.File]::ReadAllBytes($f)
            $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            $nonAscii = $bytes | Where-Object { $_ -gt 127 } | Select-Object -First 1
            if ($nonAscii -and -not $hasBom) { $bad += $f }
          }
          if ($bad) {
            Write-Host "Файлы с не-ASCII символами без BOM:`n$($bad -join "`n")"
            exit 1
          }
          Write-Host 'Кодировки в порядке.'

# Планируется добавить: osv-scanner и trivy. Сознательно не включены сейчас,
# потому что их нужно закрепить конкретной версией с проверкой контрольной
# суммы, а не тянуть подвижным тегом -- иначе CI будет нарушать ту самую
# политику, которую проверяет. См. docs/agents/TASKS.md.
